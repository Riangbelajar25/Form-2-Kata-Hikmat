<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form 2 - Kata-kata Hikmat</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,"Noto Sans SC",sans-serif;
 color:#19364b;
 background:linear-gradient(140deg,#e1f7ff,#edfff0);
 min-height:100vh;
}
header{
 background:#087fc3;color:white;
 padding:20px;text-align:center;
 font-size:23px;font-weight:bold;
}
main{max-width:750px;margin:auto;padding:20px 14px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:20px}
.tabs button{
 border:0;border-radius:17px;padding:16px 4px;
 background:#eaf3ff;color:#21516b;
 font-weight:bold;font-size:clamp(12px,3vw,18px);
}
.tabs button.active{background:#0782c7;color:white}
.card{
 background:white;border-radius:28px;
 padding:22px 18px;
 box-shadow:0 10px 25px #173f5326;
}
.heading{display:flex;justify-content:space-between;gap:8px;font-weight:bold;font-size:19px}
.score{white-space:nowrap}
.muted{color:#657888}
.bar{height:13px;background:#e5edf4;border-radius:20px;overflow:hidden;margin:22px 0}
.fill{height:100%;background:#30bb7a;width:0;transition:.3s}
.proverb{text-align:center;font-size:clamp(23px,5vw,33px);margin:27px 0}
.picture{
 width:100%;aspect-ratio:16/10;object-fit:cover;
 border-radius:22px;background:#e8f6ff;
}
.placeholder{
 aspect-ratio:16/10;display:grid;place-items:center;
 border-radius:22px;background:linear-gradient(120deg,#d7f5ff,#e8fbe2);
 font-size:65px;
}
.translation{
 min-height:190px;display:grid;place-items:center;
 text-align:center;background:#def4ff;
 border-radius:24px;padding:22px;
 font-size:clamp(24px,5vw,36px);
 font-weight:bold;margin:25px 0;
}
.info{
 background:#eef8ff;border:2px solid #b9e3fb;
 border-radius:18px;padding:16px;margin-top:14px;
 line-height:1.8;
}
.info strong{color:#0673b3}
.choices{display:grid;gap:12px;margin-top:24px}
.choice{
 padding:18px 16px;border:3px solid #d5e7f4;
 background:#f0f7ff;border-radius:20px;
 color:#19364b;font-size:clamp(16px,3.5vw,21px);
 font-weight:bold;text-align:left;cursor:pointer;
}
.choice.correct{background:#ddf9e7;border-color:#2bbb72}
.choice.wrong{background:#ffe5e5;border-color:#f17b7b}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.btn{
 border:0;border-radius:17px;padding:15px;
 background:#087ec4;color:white;
 font-size:16px;font-weight:bold;cursor:pointer;
}
.btn.next{background:#ffca22;color:#183449}
button:disabled{opacity:.4;cursor:default}
.feedback{margin-top:18px;font-weight:bold;line-height:1.6}
</style>
</head>
<body>

<header>📚 Form 2 · Kata-kata Hikmat 格言学习</header>

<main>
<nav class="tabs">
<button onclick="changeLevel(1)" id="tab1">1 · Gambar</button>
<button onclick="changeLevel(2)" id="tab2">2 · Kata Kunci</button>
<button onclick="changeLevel(3)" id="tab3">3 · Maksud</button>
</nav>

<section class="card">
<div class="heading">
<span id="heading"></span>
<span class="score" id="score"></span>
</div>
<p class="muted" id="counter"></p>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="content"></div>
<div class="feedback" id="feedback"></div>
<div class="controls">
<button class="btn" id="prev" onclick="previous()">◀ 上一张</button>
<button class="btn next" id="next" onclick="advance()">下一张 ▶</button>
</div>
</section>
</main>

<script>
const lessons=[
{
title:"Bahasa Jiwa Bangsa",
zh:"语言是民族的灵魂",
meaning:"Bahasa melambangkan identiti sesuatu bangsa.",
key:"Bahasa（语言）",
teaching:"Kita hendaklah mencintai bahasa kebangsaan.",
emoji:"🇲🇾",
img:"images/bahasa-jiwa-bangsa.png"
},
{
title:"Bahasa Menunjukkan Bangsa",
zh:"言语体现一个人的修养与民族文化",
meaning:"Pertuturan seseorang mencerminkan peribadi dan bangsanya.",
key:"Pertuturan（言语）",
teaching:"Kita hendaklah bertutur dengan sopan.",
emoji:"🗣️",
img:"images/bahasa-menunjukkan-bangsa.png"
},
{
title:"Bersatu Teguh Bercerai Roboh",
zh:"团结就是力量，分裂就会失败",
meaning:"Perpaduan menjadikan kita kuat, perpecahan menjadikan kita lemah.",
key:"Bersatu（团结）",
teaching:"Kita hendaklah sentiasa bersatu padu.",
emoji:"🤝",
img:"images/bersatu-teguh.png"
},
{
title:"Bersekutu Bertambah Mutu",
zh:"团结合作，成果更好",
meaning:"Kerjasama menghasilkan sesuatu yang lebih baik.",
key:"Kerjasama（合作）",
teaching:"Kita hendaklah bekerjasama dalam kumpulan.",
emoji:"🙌",
img:"images/bersekutu-bertambah-mutu.png"
},
{
title:"Ilmu Pelita Hidup",
zh:"知识是人生的明灯",
meaning:"Ilmu memberi penerangan dan panduan dalam hidup.",
key:"Ilmu（知识）",
teaching:"Kita hendaklah rajin menuntut ilmu.",
emoji:"📚",
img:"images/ilmu-pelita-hidup.png"
},
{
title:"Kata Dikotakan",
zh:"说到做到，遵守承诺",
meaning:"Janji yang diberikan hendaklah ditunaikan.",
key:"Janji（承诺）",
teaching:"Kita mesti menepati janji.",
emoji:"✅",
img:"images/kata-dikotakan.png"
},
{
title:"Masa Itu Emas",
zh:"时间就是金钱，要珍惜时间",
meaning:"Masa sangat bernilai dan tidak boleh diulang.",
key:"Masa（时间）",
teaching:"Kita hendaklah menggunakan masa dengan bijak.",
emoji:"⏰",
img:"images/masa-itu-emas.png"
},
{
title:"Membaca Itu Jambatan Ilmu",
zh:"阅读是通往知识的桥梁",
meaning:"Membaca menambahkan pengetahuan.",
key:"Membaca（阅读）",
teaching:"Kita hendaklah rajin membaca buku.",
emoji:"📖",
img:"images/membaca-jambatan-ilmu.png"
},
{
title:"Muafakat Itu Berkat",
zh:"协商合作带来好处",
meaning:"Perbincangan dan persetujuan bersama membawa kebaikan.",
key:"Muafakat（协商／共识）",
teaching:"Kita hendaklah bekerjasama dan bermuafakat.",
emoji:"🤝",
img:"images/muafakat-itu-berkat.png"
},
{
title:"Memandu Cermat, Jiwa Selamat",
zh:"小心驾驶，保障安全",
meaning:"Pemanduan yang berhati-hati dapat mengelakkan kemalangan.",
key:"Berhati-hati（小心谨慎）",
teaching:"Kita hendaklah mematuhi peraturan jalan raya.",
emoji:"🚗",
img:"images/memandu-cermat.png"
},
{
title:"Membazir Itu Amalan Syaitan",
zh:"浪费是不良行为，应当节约",
meaning:"Pembaziran ialah perbuatan yang tidak baik dan perlu dielakkan.",
key:"Pembaziran（浪费）",
teaching:"Kita hendaklah berjimat cermat dan tidak membazir.",
emoji:"♻️",
img:"images/membazir-amalan-syaitan.png"
}
];

let level=1;
let index=0;
let questions=[];
let answered=false;
let points={2:0,3:0};
let responses={2:{},3:{}};

const $=id=>document.getElementById(id);

function shuffle(arr){
 let a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function resetQuestions(){
 questions=shuffle(lessons.map((_,i)=>i));
 index=0;
 answered=false;
}

function changeLevel(n){
 level=n;
 resetQuestions();
 render();
}

function imageHTML(item){
 return `<div class="placeholder" id="placeholder">${item.emoji}</div>
 <img class="picture" id="lessonImage" style="display:none">`;
}

function loadImage(item){
 const img=$("lessonImage");
 if(!img)return;
 img.onload=()=>{
  img.style.display="block";
  $("placeholder").style.display="none";
 };
 img.onerror=()=>{
  img.style.display="none";
  $("placeholder").style.display="grid";
 };
 img.src=item.img;
}

function getOptions(item){
 const others=shuffle(lessons.filter(x=>x!==item)).slice(0,3);
 return shuffle([item,...others]);
}

function render(){
 for(let i=1;i<=3;i++){
  $("tab"+i).classList.toggle("active",i===level);
 }

 const item=level===1?lessons[index]:lessons[questions[index]];
 const saved=level===1?null:responses[level][questions[index]];
 answered=!!saved;

 $("heading").textContent=
  level===1?"Level 1 · 认识格言":
  level===2?"Level 2 · 华文配格言":
  "Level 3 · 格言配意思";

 $("score").textContent=level===1?"📘 学习":
 "⭐ "+points[level]+" / 110";

 $("counter").textContent=
 (level===1?"学习卡 ":"Soalan ")+(index+1)+" / 11";

 $("fill").style.width=((index+(answered?1:0))/11*100)+"%";
 $("feedback").textContent="";

 $("prev").disabled=index===0;
 $("next").disabled=level!==1&&!answered;
 $("prev").textContent=level===1?"◀ 上一张":"◀ 上一题";
 $("next").textContent=index===10?
 (level===3?"完成 ✓":"进入下一关 ▶"):
 (level===1?"下一张 ▶":"下一题 ▶");

 if(level===1){
  $("content").innerHTML=`
  <h2 class="proverb">${item.title}</h2>
  ${imageHTML(item)}
  <div class="info"><strong>华文翻译：</strong>${item.zh}</div>
  <div class="info">
   <strong>Maksud（意思）：</strong>
   <div>${item.meaning}</div>
   <div>华文：${item.zh}</div>
  </div>
  <div class="info">
   <strong>🔑 Kata Kunci（关键词）：</strong>${item.key}
  </div>
  <div class="info">
   <strong>🌱 Pengajaran（教训）：</strong>
   ${item.teaching}
  </div>`;
  loadImage(item);
  return;
 }

 if(level===2){
  $("content").innerHTML=`
   <div class="translation">${item.zh}</div>
   <div class="choices" id="choices"></div>`;
 }else{
  $("content").innerHTML=`
   <h2 class="proverb">${item.title}</h2>
   ${imageHTML(item)}
   <div class="choices" id="choices"></div>`;
  loadImage(item);
 }

 const options=saved?saved.options:getOptions(item).map(x=>x.title);

 options.forEach(title=>{
  const option=lessons.find(x=>x.title===title);
  const btn=document.createElement("button");
  btn.className="choice";
  btn.textContent=level===2?option.title:option.meaning;

  if(saved){
   btn.disabled=true;
   if(title===item.title)btn.classList.add("correct");
   else if(title===saved.selected)btn.classList.add("wrong");
  }else{
   btn.onclick=()=>answer(item,title,options);
  }
  $("choices").appendChild(btn);
 });

 if(saved){
  $("feedback").textContent=saved.correct?
   "✅ Betul! 答对了！":
   "❌ 正确答案："+(level===2?item.title:item.meaning);
 }
}

function answer(item,selected,options){
 if(answered)return;
 const correct=selected===item.title;
 const key=questions[index];
 responses[level][key]={selected,options,correct};
 if(correct)points[level]+=10;
 answered=true;
 render();
}

function previous(){
 if(index>0){
  index--;
  render();
 }
}

function advance(){
 if(level!==1&&!answered)return;
 if(index<10){
  index++;
  render();
  return;
 }
 if(level<3){
  changeLevel(level+1);
 }else{
  $("content").innerHTML=`
   <h2 class="proverb">🎉 恭喜完成全部关卡！</h2>
   <div class="info">Level 2：${points[2]} / 110</div>
   <div class="info">Level 3：${points[3]} / 110</div>
   <div class="info">总分：${points[2]+points[3]} / 220</div>`;
  $("feedback").textContent="Syabas! 继续努力！";
  $("next").disabled=false;
  $("next").textContent="重新开始 ↻";
  $("next").onclick=restart;
 }
}

function restart(){
 points={2:0,3:0};
 responses={2:{},3:{}};
 $("next").onclick=advance;
 changeLevel(1);
}

resetQuestions();
render();
</script>
</body>
</html>
