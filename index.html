<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form 2 Kata-kata Hikmat</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,"Noto Sans SC",sans-serif;
 color:#19384e;
 background:linear-gradient(135deg,#dff6ff,#eaffef);
 min-height:100vh;
}
header{
 background:#087fc5;color:white;
 text-align:center;padding:20px;
 font-size:22px;font-weight:bold;
}
main{max-width:760px;margin:auto;padding:15px}
.card{
 background:white;border-radius:25px;
 padding:22px 18px;margin:15px 0;
 box-shadow:0 8px 24px #123f5825;
}
h1,h2{text-align:center}
h1{font-size:25px}
input{
 width:100%;padding:16px;
 font-size:19px;border:2px solid #bddff5;
 border-radius:15px;
}
button{
 border:0;border-radius:15px;
 padding:15px;font-size:16px;
 font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.45;cursor:default}
.blue{background:#0782c6;color:white}
.yellow{background:#ffce29;color:#18364c}
.full{width:100%;margin-top:18px}
.hidden{display:none!important}
.tabs{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;margin:16px 0;
}
.tabs button{
 background:#e8f3ff;color:#22526e;
 font-size:clamp(12px,3vw,17px);
 padding:15px 5px;
}
.tabs button.active{
 background:#0782c6;color:white;
}
.row{
 display:flex;align-items:center;
 justify-content:space-between;gap:10px;
}
.small{color:#64798a;font-size:14px}
.progress{
 background:#e5edf4;height:13px;
 border-radius:20px;overflow:hidden;
 margin:20px 0;
}
.fill{
 height:100%;width:0;
 background:#2cbd79;transition:.3s;
}
.proverb{
 text-align:center;
 font-size:clamp(23px,5vw,33px);
 margin:25px 0;
}
.picture{
 width:100%;aspect-ratio:16/10;
 object-fit:cover;border-radius:20px;
 background:#e6f5ff;display:block;
}
.placeholder{
 aspect-ratio:16/10;
 border-radius:20px;
 display:grid;place-items:center;
 font-size:65px;
 background:linear-gradient(120deg,#dff4ff,#e7fae3);
}
.info{
 padding:15px;margin-top:12px;
 border-radius:17px;
 background:#eef8ff;
 border:2px solid #c5e6fa;
 line-height:1.8;
}
.info strong{color:#0678b9}
.translation{
 min-height:180px;
 background:#dff3ff;
 border-radius:23px;
 display:grid;place-items:center;
 text-align:center;padding:22px;
 font-size:clamp(24px,5vw,35px);
 font-weight:bold;margin:25px 0;
}
.question{
 font-size:21px;
 font-weight:bold;
 line-height:1.8;
 margin:20px 0;
}
.choices{
 display:grid;gap:12px;
 margin-top:22px;
}
.choice{
 background:#f0f7ff;
 border:3px solid #d4e6f3;
 color:#19384e;
 padding:17px;
 border-radius:18px;
 text-align:left;
 font-size:17px;
 line-height:1.5;
}
.choice.correct{
 background:#dff9e8;
 border-color:#2bbb72;
}
.choice.wrong{
 background:#ffe6e6;
 border-color:#ed7777;
}
.controls{
 display:flex;
 justify-content:space-between;
 gap:10px;margin-top:23px;
}
.feedback{
 margin-top:16px;
 font-weight:bold;
 line-height:1.7;
}
</style>
</head>
<body>

<header>📚 Form 2 · Kata-kata Hikmat</header>

<main>

<section id="login" class="card">
<h1>🌟 Selamat Datang!</h1>
<h2>欢迎来到格言学习游戏</h2>
<p>Nama Murid（学生名字）</p>
<input id="studentName"
 placeholder="Masukkan nama anda"
 maxlength="40">
<button class="blue full" onclick="startGame()">
Mula Belajar · 开始学习 ▶
</button>
</section>

<section id="game" class="hidden">

<div class="card">
<div class="row">
<strong id="welcome"></strong>
<button onclick="logout()">退出</button>
</div>
</div>

<div class="tabs">
<button id="tab1" onclick="changeLevel(1)">
1 · Gambar
</button>
<button id="tab2" onclick="changeLevel(2)">
2 · Kata Hikmat
</button>
<button id="tab3" onclick="changeLevel(3)">
3 · Isi Tempat Kosong
</button>
</div>

<div class="card">
<div class="row">
<strong id="levelTitle"></strong>
<strong id="score"></strong>
</div>

<p class="small" id="counter"></p>

<div class="progress">
<div class="fill" id="fill"></div>
</div>

<div id="content"></div>
<div class="feedback" id="feedback"></div>

<div class="controls">
<button class="blue" id="prev"
 onclick="previous()">◀ 上一题</button>
<button class="yellow" id="next"
 onclick="advance()">下一题 ▶</button>
</div>
</div>
</section>
</main>

<script>
// 11 个格言
const lessons=[
{
title:"Bahasa Jiwa Bangsa",
zh:"语言是民族的灵魂",
meaning:"Bahasa melambangkan identiti sesuatu bangsa.",
key:"Bahasa（语言）",
teaching:"Kita hendaklah mencintai bahasa kebangsaan.",
emoji:"🇲🇾",
img:"images/bahasa-jiwa-bangsa.png"
},
{
title:"Bahasa Menunjukkan Bangsa",
zh:"言语体现一个人的修养与民族文化",
meaning:"Pertuturan seseorang mencerminkan peribadi dan bangsanya.",
key:"Pertuturan（言语）",
teaching:"Kita hendaklah bertutur dengan sopan.",
emoji:"🗣️",
img:"images/bahasa-menunjukkan-bangsa.png"
},
{
title:"Bersatu Teguh Bercerai Roboh",
zh:"团结就是力量，分裂就会失败",
meaning:"Perpaduan menjadikan kita kuat, perpecahan menjadikan kita lemah.",
key:"Bersatu（团结）",
teaching:"Kita hendaklah sentiasa bersatu padu.",
emoji:"🤝",
img:"images/bersatu-teguh.png"
},
{
title:"Bersekutu Bertambah Mutu",
zh:"团结合作，成果更好",
meaning:"Kerjasama menghasilkan sesuatu yang lebih baik.",
key:"Kerjasama（合作）",
teaching:"Kita hendaklah bekerjasama dalam kumpulan.",
emoji:"🙌",
img:"images/bersekutu-bertambah-mutu.png"
},
{
title:"Ilmu Pelita Hidup",
zh:"知识是人生的明灯",
meaning:"Ilmu memberi penerangan dan panduan dalam hidup.",
key:"Ilmu（知识）",
teaching:"Kita hendaklah rajin menuntut ilmu.",
emoji:"📚",
img:"images/ilmu-pelita-hidup.png"
},
{
title:"Kata Dikotakan",
zh:"说到做到，遵守承诺",
meaning:"Janji yang diberikan hendaklah ditunaikan.",
key:"Janji（承诺）",
teaching:"Kita mesti menepati janji.",
emoji:"✅",
img:"images/kata-dikotakan.png"
},
{
title:"Masa Itu Emas",
zh:"时间就是金钱，要珍惜时间",
meaning:"Masa sangat bernilai dan tidak boleh diulang.",
key:"Masa（时间）",
teaching:"Kita hendaklah menggunakan masa dengan bijak.",
emoji:"⏰",
img:"images/masa-itu-emas.png"
},
{
title:"Membaca Itu Jambatan Ilmu",
zh:"阅读是通往知识的桥梁",
meaning:"Membaca menambahkan pengetahuan.",
key:"Membaca（阅读）",
teaching:"Kita hendaklah rajin membaca buku.",
emoji:"📖",
img:"images/membaca-jambatan-ilmu.png"
},
{
title:"Muafakat Itu Berkat",
zh:"协商合作带来好处",
meaning:"Perbincangan dan persetujuan bersama membawa kebaikan.",
key:"Muafakat（协商／共识）",
teaching:"Kita hendaklah bekerjasama dan bermuafakat.",
emoji:"🤝",
img:"images/muafakat-itu-berkat.png"
},
{
title:"Memandu Cermat, Jiwa Selamat",
zh:"小心驾驶，保障安全",
meaning:"Pemanduan yang berhati-hati dapat mengelakkan kemalangan.",
key:"Berhati-hati（小心谨慎）",
teaching:"Kita hendaklah mematuhi peraturan jalan raya.",
emoji:"🚗",
img:"images/memandu-cermat.png"
},
{
title:"Membazir Itu Amalan Syaitan",
zh:"浪费是不良行为，应当节约",
meaning:"Pembaziran ialah perbuatan yang tidak baik dan perlu dielakkan.",
key:"Pembaziran（浪费）",
teaching:"Kita hendaklah berjimat cermat dan tidak membazir.",
emoji:"♻️",
img:"images/membazir-amalan-syaitan.png"
}
];

// Level 3：15 道情境填充题
// 每题：马来文、华文提示、正确格言
const fillQuestions=[
[
"Cikgu Farah mengingatkan murid-murid supaya menggunakan bahasa kebangsaan dengan bangga kerana ________.",
"老师提醒学生要以使用国语为荣。",
"Bahasa Jiwa Bangsa"
],
[
"Amir sentiasa bercakap dengan sopan kerana dia percaya bahawa ________.",
"阿米尔说话有礼貌，因为言语反映个人修养。",
"Bahasa Menunjukkan Bangsa"
],
[
"Semua ahli pasukan bersatu hati untuk menghadapi cabaran kerana ________.",
"全队团结一致面对挑战。",
"Bersatu Teguh Bercerai Roboh"
],
[
"Hasil kerja kumpulan itu menjadi lebih baik selepas semua ahli saling membantu kerana ________.",
"组员互相帮助，使作品更出色。",
"Bersekutu Bertambah Mutu"
],
[
"Kita perlu rajin belajar untuk membina masa depan yang cerah kerana ________.",
"我们应该勤奋学习，创造光明的未来。",
"Ilmu Pelita Hidup"
],
[
"Walaupun hujan lebat, Hakim tetap datang membantu rakannya seperti yang dijanjikan kerana ________.",
"哈金即使遇到大雨，也遵守帮助朋友的承诺。",
"Kata Dikotakan"
],
[
"Aina menyusun jadual belajar agar tidak membuang masa kerana ________.",
"艾娜安排学习时间表，避免浪费时间。",
"Masa Itu Emas"
],
[
"Setiap hari, Mei Ling membaca buku untuk menambahkan pengetahuannya kerana ________.",
"美玲每天阅读，增加知识。",
"Membaca Itu Jambatan Ilmu"
],
[
"Penduduk kampung berbincang dan mencapai persetujuan sebelum mengadakan gotong-royong kerana ________.",
"村民讨论并达成共识后才举办大扫除。",
"Muafakat Itu Berkat"
],
[
"Ayah sentiasa mematuhi had laju dan memakai tali pinggang keledar kerana ________.",
"爸爸遵守车速限制并系安全带。",
"Memandu Cermat, Jiwa Selamat"
],
[
"Ibu menasihati adik supaya tidak membuang makanan kerana ________.",
"妈妈劝弟弟不要浪费食物。",
"Membazir Itu Amalan Syaitan"
],
[
"Semasa sambutan Hari Kebangsaan, murid-murid menggunakan bahasa Melayu dengan penuh rasa bangga kerana ________.",
"国庆庆典时，学生自豪地使用马来语。",
"Bahasa Jiwa Bangsa"
],
[
"Kumar menjaga tutur katanya ketika bercakap dengan orang tua kerana ________.",
"古玛与长辈交谈时注意言辞。",
"Bahasa Menunjukkan Bangsa"
],
[
"Walaupun tugasan itu sukar, semua ahli kumpulan bekerjasama untuk menyiapkannya dengan lebih baik kerana ________.",
"虽然任务困难，组员仍合作完成。",
"Bersekutu Bertambah Mutu"
],
[
"Siti menutup suis lampu apabila keluar dari bilik kerana ________.",
"茜蒂离开房间时关灯，避免浪费电力。",
"Membazir Itu Amalan Syaitan"
]
];

const $=id=>document.getElementById(id);

let student="";
let level=1;
let index=0;
let order=[];
let scores={2:0,3:0};
let responses={2:{},3:{}};
let completed=false;

function shuffle(arr){
 let a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function startGame(){
 const name=$("studentName").value.trim();
 if(!name){
  alert("请输入学生名字！");
  return;
 }
 student=name;
 scores={2:0,3:0};
 responses={2:{},3:{}};
 $("welcome").textContent="👋 "+student;
 $("login").classList.add("hidden");
 $("game").classList.remove("hidden");
 changeLevel(1);
}

function logout(){
 student="";
 $("game").classList.add("hidden");
 $("login").classList.remove("hidden");
 $("studentName").value="";
}

function changeLevel(n){
 level=n;
 index=0;
 completed=false;
 const count=n===3?15:11;
 order=n===1?
 Array.from({length:11},(_,i)=>i):
 shuffle(Array.from({length:count},(_,i)=>i));
 render();
}

function imageHTML(item){
 return `
 <div id="placeholder" class="placeholder">
 ${item.emoji}
 </div>
 <img id="lessonImage" class="picture"
 alt="Gambar Kata-kata Hikmat"
 style="display:none">
 `;
}

function loadImage(item){
 const img=$("lessonImage");
 if(!img)return;
 img.onload=()=>{
  img.style.display="block";
  $("placeholder").style.display="none";
 };
 img.onerror=()=>{
  img.style.display="none";
  $("placeholder").style.display="grid";
 };
 img.src=item.img;
}

function getOptions(correctTitle){
 const wrong=shuffle(
  lessons.filter(x=>x.title!==correctTitle)
 ).slice(0,3).map(x=>x.title);
 return shuffle([correctTitle,...wrong]);
}

function render(){
 for(let n=1;n<=3;n++){
  $("tab"+n).classList.toggle("active",n===level);
 }

 const total=level===3?15:11;
 const key=order[index];
 const saved=level===1?null:responses[level][key];
 const answered=!!saved;

 $("levelTitle").textContent=
 level===1?"Level 1 · 认识格言":
 level===2?"Level 2 · 华文配格言":
 "Level 3 · 情境填充题";

 $("score").textContent=level===1?
 "📘 学习":"⭐ "+scores[level]+" / "+total*10;

 $("counter").textContent=
 (level===1?"学习卡 ":"Soalan ")+(index+1)+" / "+total;

 $("fill").style.width=
 ((index+(answered?1:0))/total*100)+"%";

 $("feedback").textContent="";
 $("prev").disabled=index===0;
 $("next").disabled=level!==1&&!answered;
 $("next").onclick=advance;
 $("next").textContent=index===total-1?
 (level===3?"完成 ✓":"进入下一关 ▶"):
 (level===1?"下一张 ▶":"下一题 ▶");

 if(level===1){
  const item=lessons[key];
  $("content").innerHTML=`
  <h2 class="proverb">${item.title}</h2>
  ${imageHTML(item)}
  <div class="info">
  <strong>华文翻译：</strong>${item.zh}
  </div>
  <div class="info">
  <strong>Maksud（意思）：</strong>
  <div>${item.meaning}</div>
  <div>华文：${item.zh}</div>
  </div>
  <div class="info">
  <strong>🔑 Kata Kunci（关键词）：</strong>
  ${item.key}
  </div>
  <div class="info">
  <strong>🌱 Pengajaran（教训）：</strong>
  ${item.teaching}
  </div>`;
  loadImage(item);
  return;
 }

 let correctTitle;

 if(level===2){
  const item=lessons[key];
  correctTitle=item.title;
  $("content").innerHTML=`
  <div class="translation">${item.zh}</div>
  <div class="choices" id="choices"></div>`;
 }else{
  const q=fillQuestions[key];
  correctTitle=q[2];
  $("content").innerHTML=`
  <div class="question">${q[0]}</div>
  <div class="info">
  <strong>华文提示：</strong>${q[1]}
  </div>
  <div class="choices" id="choices"></div>`;
 }

 const options=saved?saved.options:getOptions(correctTitle);

 options.forEach(title=>{
  const btn=document.createElement("button");
  btn.className="choice";
  btn.textContent=title;

  if(saved){
   btn.disabled=true;
   if(title===correctTitle){
    btn.classList.add("correct");
   }else if(title===saved.selected){
    btn.classList.add("wrong");
   }
  }else{
   btn.onclick=()=>answer(key,title,correctTitle,options);
  }
  $("choices").appendChild(btn);
 });

 if(saved){
  const item=lessons.find(x=>x.title===correctTitle);
  $("feedback").textContent=saved.correct?
  "✅ Betul! 答对了！":
  "❌ 正确答案："+correctTitle+"（"+item.zh+"）";
 }
}

function answer(key,selected,correctTitle,options){
 if(responses[level][key])return;

 const correct=selected===correctTitle;
 responses[level][key]={selected,correct,options};

 if(correct)scores[level]+=10;
 render();
}

function previous(){
 if(index>0){
  index--;
  render();
 }
}

function advance(){
 if(level!==1&&!responses[level][order[index]])return;

 const total=level===3?15:11;

 if(index<total-1){
  index++;
  render();
  return;
 }

 if(level<3){
  changeLevel(level+1);
 }else{
  showResult();
 }
}

function showResult(){
 completed=true;
 const total=scores[2]+scores[3];

 $("levelTitle").textContent="🎉 学习完成";
 $("counter").textContent=student;
 $("score").textContent="⭐ "+total+" / 260";
 $("fill").style.width="100%";

 $("content").innerHTML=`
 <h2 class="proverb">Syabas! 恭喜完成！</h2>
 <div class="info">Level 1：11 张学习卡</div>
 <div class="info">Level 2：${scores[2]} / 110</div>
 <div class="info">Level 3：${scores[3]} / 150</div>
 <div class="info">
 <strong>总分：${total} / 260</strong>
 </div>
 <p class="small">
 成绩只在本次游戏显示，不会保存。
 </p>`;

 $("feedback").textContent="Teruskan usaha! 继续努力！";
 $("prev").disabled=true;
 $("next").disabled=false;
 $("next").textContent="重新开始 ↻";
 $("next").onclick=restart;
}

function restart(){
 scores={2:0,3:0};
 responses={2:{},3:{}};
 changeLevel(1);
}

document.getElementById("studentName")
.addEventListener("keydown",e=>{
 if(e.key==="Enter")startGame();
});
</script>
</body>
</html>
