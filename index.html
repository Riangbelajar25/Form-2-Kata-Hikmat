<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kata-kata Hikmat | 中马双语学习游戏</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,"Microsoft YaHei",sans-serif;
 background:linear-gradient(150deg,#dff6ff,#effff0);
 color:#17334c;
}
header{
 background:#1379c5;color:white;
 text-align:center;padding:22px 12px;
}
h1{font-size:25px;margin:5px}
header p{margin:8px}
main{max-width:760px;margin:auto;padding:15px}
.panel{
 background:white;border-radius:20px;
 padding:20px;margin:15px 0;
 box-shadow:0 5px 18px #1234;
}
.center{text-align:center}
.hidden{display:none}
button{
 cursor:pointer;border:0;border-radius:13px;
 padding:13px;font-size:16px;
 font-weight:bold;
}
.primary{background:#087dc8;color:white}
.secondary{background:#e6f3ff;color:#12517c}
button:disabled{opacity:.5;cursor:default}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.level{background:#e9f3ff;color:#15527c}
.level.active{background:#087dc8;color:white}
#progress{height:12px;background:#e5edf4;border-radius:12px;overflow:hidden}
#bar{height:100%;background:#2dbd78;width:0;transition:.3s}
#picture{
 background:linear-gradient(135deg,#d8f5ff,#ecffdd);
 border-radius:20px;
 min-height:210px;
 display:flex;align-items:center;justify-content:center;
 margin:15px 0;
 font-size:95px;
 text-align:center;
 padding:12px;
}
#picture img{max-width:100%;max-height:300px;border-radius:14px}
.options{display:grid;gap:10px;margin-top:15px}
.option{
 text-align:left;background:#f0f7ff;
 border:2px solid #d4e8f9;
 color:#153d5a;
 line-height:1.5;
}
.option.correct{background:#d9f8e4;border-color:#22a95a}
.option.wrong{background:#ffe1e1;border-color:#e94a4a}
#feedback{font-size:16px;line-height:1.8;margin-top:14px}
.translation{color:#396b8b;font-size:15px}
.small{font-size:14px;color:#64748b}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
#next{width:100%;margin-top:15px}
@media(max-width:430px){
 .panel{padding:14px}
 h1{font-size:21px}
 .levels{gap:4px}
 .level{font-size:13px;padding:10px 3px}
 #picture{min-height:175px;font-size:75px}
}
</style>
</head>
<body>
<header>
<h1>🌟 Kata-kata Hikmat 🌟</h1>
<p>马来文格言 · 中马双语配对游戏</p>
<p>11 Peribahasa · 3 Tahap</p>
</header>

<main>
<section class="panel center" id="home">
<h2>🎮 Selamat Datang!</h2>
<p>欢迎来到格言学习游戏</p>
<p>通过图片、关键词和意思学习马来文格言。</p>
<p>每关 11 题，答对一题得 10 分。</p>
<button class="primary" onclick="startGame()">开始游戏 / Mula Bermain</button>
</section>

<section id="game" class="hidden">
<div class="levels">
<button class="level" id="lv1">1 · Gambar</button>
<button class="level" id="lv2">2 · Kata Kunci</button>
<button class="level" id="lv3">3 · Maksud</button>
</div>

<div class="panel">
<div class="row">
<b id="levelTitle"></b>
<b id="score"></b>
</div>
<p id="counter" class="small"></p>
<div id="progress"><div id="bar"></div></div>
<h2 id="question" class="center"></h2>
<div id="picture"></div>
<div id="options" class="options"></div>
<div id="feedback" aria-live="polite"></div>
<button id="next" class="primary hidden" onclick="nextQuestion()">
下一题 / Seterusnya ➜
</button>
</div>
</section>

<section id="finish" class="panel center hidden">
<h2 id="finishTitle">🎉 Tahniah!</h2>
<h1 id="finalScore"></h1>
<p id="finishText"></p>
<button class="primary" onclick="continueGame()" id="continueBtn">
下一关 / Tahap Seterusnya
</button>
<button class="secondary" onclick="restartGame()">
重新开始 / Main Semula
</button>
</section>
</main>

<script>
const words=[
{
name:"Bahasa Jiwa Bangsa",
cn:"语言是民族的灵魂",
key:"Bahasa",
keyCn:"语言",
meaning:"Bahasa melambangkan identiti sesuatu bangsa.",
meaningCn:"语言象征一个民族的身份。",
lesson:"Kita hendaklah memartabatkan bahasa kebangsaan.",
emoji:"🇲🇾📚👧🏻👦🏽"
},
{
name:"Bahasa Menunjukkan Bangsa",
cn:"言语体现一个人的修养",
key:"Pertuturan",
keyCn:"言语",
meaning:"Cara seseorang bertutur mencerminkan keperibadiannya.",
meaningCn:"一个人的说话方式反映其品格。",
lesson:"Kita hendaklah bertutur dengan sopan.",
emoji:"👩‍🏫💬🙋"
},
{
name:"Bersatu Teguh Bercerai Roboh",
cn:"团结则强，分裂则弱",
key:"Bersatu",
keyCn:"团结",
meaning:"Perpaduan menjadikan kita kuat, perpecahan menjadikan kita lemah.",
meaningCn:"团结使我们强大，分裂使我们弱小。",
lesson:"Kita hendaklah hidup bersatu padu.",
emoji:"🤝💪🧑‍🤝‍🧑"
},
{
name:"Bersekutu Bertambah Mutu",
cn:"团结合作，成果更好",
key:"Kerjasama",
keyCn:"合作",
meaning:"Kerjasama menghasilkan sesuatu yang lebih baik.",
meaningCn:"合作能够取得更好的成果。",
lesson:"Kita hendaklah bekerjasama.",
emoji:"👧🧒🌱🌷"
},
{
name:"Ilmu Pelita Hidup",
cn:"知识是人生的明灯",
key:"Ilmu",
keyCn:"知识",
meaning:"Ilmu memberi penerangan dan panduan dalam hidup.",
meaningCn:"知识为人生带来光明和指引。",
lesson:"Kita perlu rajin menuntut ilmu.",
emoji:"📚🏮💡"
},
{
name:"Kata Dikotakan",
cn:"说到做到，遵守承诺",
key:"Janji",
keyCn:"承诺",
meaning:"Janji yang diberikan hendaklah ditunaikan.",
meaningCn:"许下的承诺必须履行。",
lesson:"Kita mesti menepati janji.",
emoji:"🙋✍️✅"
},
{
name:"Masa Itu Emas",
cn:"时间就是金钱",
key:"Masa",
keyCn:"时间",
meaning:"Masa sangat bernilai dan tidak boleh diulang.",
meaningCn:"时间非常宝贵，而且无法重来。",
lesson:"Gunakan masa dengan bijak.",
emoji:"⏰🪙📖"
},
{
name:"Membaca Itu Jambatan Ilmu",
cn:"阅读是获取知识的桥梁",
key:"Membaca",
keyCn:"阅读",
meaning:"Membaca menambahkan pengetahuan.",
meaningCn:"阅读能够增加知识。",
lesson:"Kita perlu rajin membaca.",
emoji:"📖🌉🏫"
},
{
name:"Muafakat Itu Berkat",
cn:"协商合作带来好处",
key:"Muafakat",
keyCn:"共识",
meaning:"Perbincangan dan persetujuan bersama membawa kebaikan.",
meaningCn:"共同商讨并达成共识能够带来好处。",
lesson:"Kita hendaklah bermuafakat.",
emoji:"👨‍👩‍👧‍👦🤝🍎"
},
{
name:"Memandu Cermat, Jiwa Selamat",
cn:"小心驾驶，保障安全",
key:"Berhati-hati",
keyCn:"小心谨慎",
meaning:"Pemanduan yang berhati-hati dapat mengelakkan kemalangan.",
meaningCn:"小心驾驶可以避免交通意外。",
lesson:"Kita mestilah mematuhi peraturan jalan raya.",
emoji:"🚗🚦🛡️"
},
{
name:"Membazir Itu Amalan Syaitan",
cn:"浪费是不良行为",
key:"Pembaziran",
keyCn:"浪费",
meaning:"Pembaziran merupakan perbuatan yang tidak baik.",
meaningCn:"浪费是一种不好的行为。",
lesson:"Kita hendaklah berjimat cermat.",
emoji:"🚰🍚♻️"
}
];

let level=1;
let index=0;
let score=0;
let totalScore=0;
let questions=[];
let answered=false;

const $=id=>document.getElementById(id);

function shuffle(arr){
let a=[...arr];
for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function startGame(){
$("home").classList.add("hidden");
$("finish").classList.add("hidden");
$("game").classList.remove("hidden");
index=0;score=0;
questions=shuffle(words);
renderQuestion();
}

function getAnswer(w){
if(level===1)return w.name;
if(level===2)return w.key+"（"+w.keyCn+"）";
return w.meaning;
}

function renderQuestion(){
answered=false;
const w=questions[index];
$("feedback").innerHTML="";
$("next").classList.add("hidden");
$("score").textContent="⭐ "+score+" / 110";
$("counter").textContent="Soalan "+(index+1)+" / 11";
$("bar").style.width=(index/11*100)+"%";

for(let n=1;n<=3;n++){
$("lv"+n).classList.toggle("active",n===level);
}

$("levelTitle").textContent=
level===1?"Level 1 · 图片配格言":
level===2?"Level 2 · 格言配关键词":
"Level 3 · 格言配意思";

$("picture").classList.remove("hidden");

if(level===1){
$("question").textContent="Pilih kata-kata hikmat yang betul.";
$("picture").textContent=w.emoji;
}else{
$("question").textContent=w.name;
$("picture").classList.add("hidden");
}

const correct=getAnswer(w);
const wrong=shuffle(words.filter(x=>x!==w))
.slice(0,3).map(getAnswer);
const choices=shuffle([correct,...wrong]);
$("options").innerHTML="";

choices.forEach(choice=>{
const b=document.createElement("button");
b.className="option";
b.textContent=choice;
b.onclick=()=>checkAnswer(b,choice,correct,w);
$("options").appendChild(b);
});
}

function checkAnswer(button,choice,correct,w){
if(answered)return;

if(choice!==correct){
button.classList.add("wrong");
button.disabled=true;
$("feedback").innerHTML=
"❌ Cuba lagi! 再试一次！";
return;
}

answered=true;
score+=10;
totalScore+=10;
button.classList.add("correct");

document.querySelectorAll(".option").forEach(b=>{
b.disabled=true;
if(b.textContent===correct)b.classList.add("correct");
});

$("score").textContent="⭐ "+score+" / 110";

$("feedback").innerHTML=
"<b>✅ Betul! 答对了！</b>"+
"<p><b>"+w.name+"</b></p>"+
"<p>🇨🇳 "+w.cn+"</p>"+
"<p><b>Kata Kunci:</b> "+w.key+"（"+w.keyCn+"）</p>"+
"<p><b>Maksud:</b> "+w.meaning+"</p>"+
"<p class='translation'>华文："+w.meaningCn+"</p>"+
"<p><b>Pengajaran:</b> "+w.lesson+"</p>";

$("next").classList.remove("hidden");
}

function nextQuestion(){
index++;
if(index>=questions.length){
showFinish();
}else{
renderQuestion();
}
}

function showFinish(){
$("game").classList.add("hidden");
$("finish").classList.remove("hidden");
$("finalScore").textContent=score+" / 110";
$("finishTitle").textContent="🎉 Tahniah! 恭喜完成！";
$("finishText").textContent=
"你已经完成 Level "+level+
"。目前三关累计得分："+totalScore+" / 330";
$("continueBtn").classList.toggle("hidden",level===3);
}

function continueGame(){
if(level<3){
level++;
startGame();
}
}

function restartGame(){
level=1;
totalScore=0;
startGame();
}
</script>
</body>
</html>
