<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form 2 Kata-kata Hikmat</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,"Noto Sans SC",sans-serif;
 background:linear-gradient(135deg,#dff5ff,#effff0);
 color:#18374d;
 min-height:100vh;
}
header{
 background:#0782c6;color:white;
 padding:20px;text-align:center;
 font-size:22px;font-weight:bold;
}
main{max-width:750px;margin:auto;padding:16px}
.card{
 background:white;border-radius:25px;
 padding:22px 18px;margin-top:15px;
 box-shadow:0 8px 25px #16456822;
}
h1,h2{text-align:center}
h1{font-size:25px}
input{
 width:100%;padding:16px;font-size:19px;
 border:2px solid #b9dff5;border-radius:15px;
}
button{
 cursor:pointer;border:0;border-radius:15px;
 padding:15px;font-size:16px;font-weight:bold;
}
button:disabled{opacity:.45;cursor:default}
.primary{background:#0782c6;color:white}
.yellow{background:#ffcf36;color:#20354b}
.full{width:100%;margin-top:20px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tabs button{background:#e7f3ff;color:#21516b;padding:14px 4px;font-size:13px}
.tabs button.active{background:#0782c6;color:white}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.progress{height:12px;background:#e5edf4;border-radius:20px;overflow:hidden;margin:20px 0}
.fill{height:100%;background:#29bc79;transition:.3s}
.picture{
 display:block;width:100%;aspect-ratio:16/10;
 object-fit:cover;border-radius:20px;
 background:#e7f6ff;
}
.placeholder{
 aspect-ratio:16/10;border-radius:20px;
 background:linear-gradient(120deg,#dff4ff,#e8fae5);
 display:grid;place-items:center;font-size:65px;
}
.proverb{text-align:center;font-size:clamp(23px,5vw,32px)}
.info{
 background:#eef8ff;border:2px solid #c4e6fa;
 border-radius:16px;padding:15px;margin-top:12px;
 line-height:1.8;
}
.info strong{color:#0574b7}
.translation{
 background:#def4ff;border-radius:22px;
 min-height:180px;padding:20px;
 display:grid;place-items:center;
 text-align:center;font-size:clamp(23px,5vw,34px);
 font-weight:bold;margin:25px 0;
}
.choices{display:grid;gap:12px;margin-top:22px}
.choice{
 background:#f0f7ff;border:3px solid #d5e7f4;
 border-radius:17px;padding:17px;
 text-align:left;color:#19364b;
 font-size:17px;font-weight:bold;
}
.choice.correct{background:#ddf9e7;border-color:#2bbb72}
.choice.wrong{background:#ffe5e5;border-color:#f17b7b}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.feedback{margin-top:15px;font-weight:bold;line-height:1.6}
.hidden{display:none}
.small{color:#607b8b;font-size:14px}
</style>
</head>
<body>

<header>📚 Form 2 · Kata-kata Hikmat</header>

<main>

<section class="card" id="login">
<h1>🌟 Selamat Datang!</h1>
<h2>欢迎来到格言学习游戏</h2>
<p>Nama Murid（学生名字）</p>
<input id="studentName" placeholder="Masukkan nama anda" maxlength="40">
<button class="primary full" onclick="startGame()">
Mula Belajar · 开始学习 ▶
</button>
</section>

<section id="game" class="hidden">
<div class="card">
<div class="row">
<strong id="welcome"></strong>
<button onclick="logout()">退出</button>
</div>
</div>

<div class="tabs" style="margin-top:15px">
<button id="tab1" onclick="changeLevel(1)">1 · Gambar</button>
<button id="tab2" onclick="changeLevel(2)">2 · Kata Kunci</button>
<button id="tab3" onclick="changeLevel(3)">3 · Maksud</button>
</div>

<div class="card">
<div class="row">
<strong id="levelTitle"></strong>
<strong id="score"></strong>
</div>
<p class="small" id="counter"></p>
<div class="progress"><div class="fill" id="fill"></div></div>

<div id="content"></div>
<div id="feedback" class="feedback"></div>

<div class="controls">
<button class="primary" id="prev" onclick="previous()">◀ 上一张</button>
<button class="yellow" id="next" onclick="advance()">下一张 ▶</button>
</div>
</div>
</section>

</main>

<script>
const lessons=[
{
title:"Bahasa Jiwa Bangsa",
zh:"语言是民族的灵魂",
meaning:"Bahasa melambangkan identiti sesuatu bangsa.",
key:"Bahasa（语言）",
teaching:"Kita hendaklah mencintai bahasa kebangsaan.",
emoji:"🇲🇾",
img:"images/bahasa-jiwa-bangsa.png"
},
{
title:"Bahasa Menunjukkan Bangsa",
zh:"言语体现一个人的修养与民族文化",
meaning:"Pertuturan seseorang mencerminkan peribadi dan bangsanya.",
key:"Pertuturan（言语）",
teaching:"Kita hendaklah bertutur dengan sopan.",
emoji:"🗣️",
img:"images/bahasa-menunjukkan-bangsa.png"
},
{
title:"Bersatu Teguh Bercerai Roboh",
zh:"团结就是力量，分裂就会失败",
meaning:"Perpaduan menjadikan kita kuat, perpecahan menjadikan kita lemah.",
key:"Bersatu（团结）",
teaching:"Kita hendaklah sentiasa bersatu padu.",
emoji:"🤝",
img:"images/bersatu-teguh.png"
},
{
title:"Bersekutu Bertambah Mutu",
zh:"团结合作，成果更好",
meaning:"Kerjasama menghasilkan sesuatu yang lebih baik.",
key:"Kerjasama（合作）",
teaching:"Kita hendaklah bekerjasama dalam kumpulan.",
emoji:"🙌",
img:"images/bersekutu-bertambah-mutu.png"
},
{
title:"Ilmu Pelita Hidup",
zh:"知识是人生的明灯",
meaning:"Ilmu memberi penerangan dan panduan dalam hidup.",
key:"Ilmu（知识）",
teaching:"Kita hendaklah rajin menuntut ilmu.",
emoji:"📚",
img:"images/ilmu-pelita-hidup.png"
},
{
title:"Kata Dikotakan",
zh:"说到做到，遵守承诺",
meaning:"Janji yang diberikan hendaklah ditunaikan.",
key:"Janji（承诺）",
teaching:"Kita mesti menepati janji.",
emoji:"✅",
img:"images/kata-dikotakan.png"
},
{
title:"Masa Itu Emas",
zh:"时间就是金钱，要珍惜时间",
meaning:"Masa sangat bernilai dan tidak boleh diulang.",
key:"Masa（时间）",
teaching:"Kita hendaklah menggunakan masa dengan bijak.",
emoji:"⏰",
img:"images/masa-itu-emas.png"
},
{
title:"Membaca Itu Jambatan Ilmu",
zh:"阅读是通往知识的桥梁",
meaning:"Membaca menambahkan pengetahuan.",
key:"Membaca（阅读）",
teaching:"Kita hendaklah rajin membaca buku.",
emoji:"📖",
img:"images/membaca-jambatan-ilmu.png"
},
{
title:"Muafakat Itu Berkat",
zh:"协商合作带来好处",
meaning:"Perbincangan dan persetujuan bersama membawa kebaikan.",
key:"Muafakat（协商／共识）",
teaching:"Kita hendaklah bekerjasama dan bermuafakat.",
emoji:"🤝",
img:"images/muafakat-itu-berkat.png"
},
{
title:"Memandu Cermat, Jiwa Selamat",
zh:"小心驾驶，保障安全",
meaning:"Pemanduan yang berhati-hati dapat mengelakkan kemalangan.",
key:"Berhati-hati（小心谨慎）",
teaching:"Kita hendaklah mematuhi peraturan jalan raya.",
emoji:"🚗",
img:"images/memandu-cermat.png"
},
{
title:"Membazir Itu Amalan Syaitan",
zh:"浪费是不良行为，应当节约",
meaning:"Pembaziran ialah perbuatan yang tidak baik dan perlu dielakkan.",
key:"Pembaziran（浪费）",
teaching:"Kita hendaklah berjimat cermat dan tidak membazir.",
emoji:"♻️",
img:"images/membazir-amalan-syaitan.png"
}
];

let student="";
let level=1;
let index=0;
let questions=[];
let points={2:0,3:0};
let responses={2:{},3:{}};
let finished=false;

const $=id=>document.getElementById(id);

function shuffle(arr){
 let a=[...arr];
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function startGame(){
 const name=$("studentName").value.trim();
 if(!name){
  alert("请输入学生名字！");
  return;
 }
 student=name;
 points={2:0,3:0};
 responses={2:{},3:{}};
 $("welcome").textContent="👋 "+student;
 $("login").classList.add("hidden");
 $("game").classList.remove("hidden");
 changeLevel(1);
}

function logout(){
 $("game").classList.add("hidden");
 $("login").classList.remove("hidden");
 $("studentName").value="";
 student="";
}

function changeLevel(n){
 level=n;
 index=0;
 questions=shuffle(lessons.map((_,i)=>i));
 finished=false;
 render();
}

function imageHTML(item){
 return `
 <div class="placeholder" id="placeholder">${item.emoji}</div>
 <img class="picture" id="lessonImage" alt="Gambar Kata Hikmat" style="display:none">
 `;
}

function loadImage(item){
 const img=$("lessonImage");
 if(!img)return;
 img.onload=()=>{
  img.style.display="block";
  $("placeholder").style.display="none";
 };
 img.onerror=()=>{
  img.style.display="none";
  $("placeholder").style.display="grid";
 };
 img.src=item.img;
}

function getOptions(item){
 const wrong=shuffle(
  lessons.filter(x=>x.title!==item.title)
 ).slice(0,3);
 return shuffle([item,...wrong]).map(x=>x.title);
}

function render(){
 for(let n=1;n<=3;n++){
  $("tab"+n).classList.toggle("active",n===level);
 }

 const key=level===1?index:questions[index];
 const item=lessons[key];
 const saved=level===1?null:responses[level][key];
 const answered=!!saved;

 $("levelTitle").textContent=
 level===1?"Level 1 · 认识格言":
 level===2?"Level 2 · 华文配格言":
 "Level 3 · 格言配意思";

 $("score").textContent=level===1?
 "📘 学习": "⭐ "+points[level]+" / 110";

 $("counter").textContent=
 (level===1?"学习卡 ":"Soalan ")+(index+1)+" / 11";

 $("fill").style.width=
 ((index+(level===1?0:answered?1:0))/11*100)+"%";

 $("feedback").textContent="";
 $("prev").disabled=index===0;
 $("next").disabled=level!==1&&!answered;
 $("next").onclick=advance;
 $("next").textContent=index===10?
 (level===3?"完成 ✓":"进入下一关 ▶"):
 (level===1?"下一张 ▶":"下一题 ▶");

 if(level===1){
  $("content").innerHTML=`
  <h2 class="proverb">${item.title}</h2>
  ${imageHTML(item)}
  <div class="info"><strong>华文翻译：</strong>${item.zh}</div>
  <div class="info">
   <strong>Maksud（意思）：</strong>
   <div>${item.meaning}</div>
   <div>华文：${item.zh}</div>
  </div>
  <div class="info">
   <strong>🔑 Kata Kunci（关键词）：</strong>${item.key}
  </div>
  <div class="info">
   <strong>🌱 Pengajaran（教训）：</strong>
   ${item.teaching}
  </div>`;
  loadImage(item);
  return;
 }

 if(level===2){
  $("content").innerHTML=`
  <div class="translation">${item.zh}</div>
  <div class="choices" id="choices"></div>`;
 }else{
  $("content").innerHTML=`
  <h2 class="proverb">${item.title}</h2>
  ${imageHTML(item)}
  <div class="choices" id="choices"></div>`;
  loadImage(item);
 }

 const options=saved?saved.options:getOptions(item);

 options.forEach(title=>{
  const option=lessons.find(x=>x.title===title);
  const btn=document.createElement("button");
  btn.className="choice";
  btn.textContent=level===2?option.title:option.meaning;

  if(saved){
   btn.disabled=true;
   if(title===item.title)btn.classList.add("correct");
   else if(title===saved.selected)btn.classList.add("wrong");
  }else{
   btn.onclick=()=>answer(key,title,options);
  }
  $("choices").appendChild(btn);
 });

 if(saved){
  $("feedback").textContent=saved.correct?
  "✅ Betul! 答对了！":
  "❌ 正确答案："+(level===2?item.title:item.meaning);
 }
}

function answer(key,selected,options){
 if(responses[level][key])return;
 const correct=selected===lessons[key].title;
 responses[level][key]={selected,options,correct};
 if(correct)points[level]+=10;
 render();
}

function previous(){
 if(index>0){
  index--;
  render();
 }
}

function advance(){
 if(level!==1&&!responses[level][questions[index]])return;
 if(index<10){
  index++;
  render();
  return;
 }
 if(level<3){
  changeLevel(level+1);
 }else{
  showResult();
 }
}

function showResult(){
 finished=true;
 $("levelTitle").textContent="🎉 完成学习";
 $("counter").textContent=student;
 $("fill").style.width="100%";
 $("content").innerHTML=`
 <h2 class="proverb">Syabas! 恭喜完成！</h2>
 <div class="info">Level 1：11 张学习卡已完成</div>
 <div class="info">Level 2：${points[2]} / 110</div>
 <div class="info">Level 3：${points[3]} / 110</div>
 <div class="info"><strong>总分：${points[2]+points[3]} / 220</strong></div>
 <p class="small">成绩只在本次游戏中显示，不会上传或保存。</p>`;
 $("feedback").textContent="Teruskan usaha! 继续努力！";
 $("prev").disabled=true;
 $("next").disabled=false;
 $("next").textContent="重新开始 ↻";
 $("next").onclick=restart;
}

function restart(){
 points={2:0,3:0};
 responses={2:{},3:{}};
 changeLevel(1);
}
</script>
</body>
</html>
